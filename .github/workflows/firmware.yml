name: Firmware build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pros3:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: platformio-${{ runner.os }}-6.1.18-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO Core
        run: python -m pip install platformio==6.1.18
      - name: Test input, HID ownership, and sequencer safety
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -Isrc test/KeyInput.cpp -o /tmp/puffin-input-tests
          /tmp/puffin-input-tests
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -Isrc test/KeymapConsole.cpp -o /tmp/puffin-keymap-tests
          /tmp/puffin-keymap-tests
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -Isrc test/KeyboardOutput.cpp -o /tmp/puffin-output-tests
          /tmp/puffin-output-tests
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -Isrc test/NoteKeyboard.cpp -o /tmp/puffin-note-keyboard-tests
          /tmp/puffin-note-keyboard-tests
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -Isrc test/Sequencer.cpp -o /tmp/puffin-sequencer-tests
          /tmp/puffin-sequencer-tests
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -Isrc test/MultiTrackSequencer.cpp -o /tmp/puffin-multitrack-tests
          /tmp/puffin-multitrack-tests
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -Isrc test/DisplayTransfer.cpp -o /tmp/puffin-display-tests
          /tmp/puffin-display-tests
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -Isrc test/Clock.cpp -o /tmp/puffin-clock-tests
          /tmp/puffin-clock-tests
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -Isrc test/FirmwareUpdate.cpp -o /tmp/puffin-update-tests
          /tmp/puffin-update-tests
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -Isrc test/ProjectSnapshot.cpp -o /tmp/puffin-project-snapshot-tests
          /tmp/puffin-project-snapshot-tests
          g++ -O1 -std=c++11 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -Isrc test/ProjectStore.cpp -o /tmp/puffin-project-store-tests
          /tmp/puffin-project-store-tests
          g++ -O1 -std=c++11 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -Isrc test/PatternSync.cpp -o /tmp/puffin-pattern-tests
          /tmp/puffin-pattern-tests
      - name: Build ProS3 firmware
        run: pio run --environment ProS3
      - name: Package OTA application image
        # Application-only image accepted by the BLE updater; never a merged flash image.
        run: |
          mkdir -p dist
          cp .pio/build/ProS3/firmware.bin dist/firmware.bin
          (cd dist && sha256sum firmware.bin > firmware.bin.sha256 && sha256sum --check firmware.bin.sha256)
      - name: Upload OTA application artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: puffin-ProS3-${{ github.sha }}
          path: |
            dist/firmware.bin
            dist/firmware.bin.sha256
          if-no-files-found: error
          retention-days: 30
          overwrite: true
