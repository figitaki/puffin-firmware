name: Firmware build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pros3:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: platformio-${{ runner.os }}-6.1.18-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO Core
        run: python -m pip install platformio==6.1.18
      - name: Test physical key input and layers
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -Isrc test/KeyInput.cpp -o /tmp/puffin-input-tests
          /tmp/puffin-input-tests
      - name: Build ProS3 firmware
        run: pio run --environment ProS3
