name: PuffinUpdater
options:
  bundleIdPrefix: com.puffin
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
targets:
  PuffinUpdater:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.puffin.updater
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Puffin Updater
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Connect to Puffin in physical maintenance mode to transfer firmware you select.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  PuffinUpdaterTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: PuffinUpdater
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  PuffinUpdaterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: PuffinUpdater
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PuffinUpdater:
    build:
      targets:
        PuffinUpdater: all
    test:
      targets: [PuffinUpdaterTests, PuffinUpdaterUITests]
